openapi: 3.1.0
info:
  title: RESILIENCE-ALPHA — Moteur de remédiation
  version: 0.4.0
  description: |
    Contrat du moteur de remédiation automatique.
    Producteur : Dev. Consommateurs : Infra (Alertmanager), Cyber (WAF / SIEM), dashboard de supervision.
    Le module IA ne remédie pas (docs/ia/INTEGRATION.md) : il publie une métrique Prometheus, sans appel à ce moteur.

    ## État de l'implémentation (v1, gel du 22/10) — ADR-DEV-0007

    Pour la démo, le moteur est **réparti sur deux services Compose** :

    | Service | Code | Rôle | Endpoints servis | Port publié (127.0.0.1) |
    |---|---|---|---|---|
    | `remediation` | `services/remediation` (Dev) | **Surveiller** : watchdog, topologie, flux du dashboard | `/services`, `/events` (SSE), sondes | 18090 |
    | `auto-recovery` | `services/auto-recovery` (Infra) | **Agir** : alerte Alertmanager → restart via docker-proxy → transaction de preuve | `/webhook/alertmanager`, `/events` (journal JSON), `/health` | 18095 |

    Les opérations marquées `x-implementation: v2` (`/alerts`, `/incidents`, `/playbooks`) sont la cible du
    contrat mais **ne sont pas servies en v1**. Le reste de cette description (cycle de vie, déduplication,
    playbooks) décrit cette cible ; l'écart de la v1 est détaillé sur `/webhook/alertmanager`.

    ## Cycle de vie d'un incident

    ```
    alerte → DETECTED → DECIDED → ACTING → VERIFYING → RESOLVED
                                     ↑          │
                                     └──────────┘ (vérification en échec : nouvelle tentative)
                                                └──→ ESCALATED (après 3 tentatives)
    ```

    - **Aucune action humaine** : il n'existe aucun endpoint pour déclencher, valider ou rejouer une action.
      Le moteur décide seul à partir de la table des playbooks (`GET /playbooks`), explicite et versionnée.
    - **Preuve de reprise** : un incident n'est `RESOLVED` que si les trois vérifications réussissent :
      1. `/ready` de `payment-api` et `auth` répond 200 ;
      2. le smoke test réussit une **nouvelle transaction fictive** à travers le WAF : login `smoke-client` →
         lecture des comptes → paiement de 0,01 € → relecture. Appel : `GET http://txprobe:8000/check` (service
         Compose `txprobe`, code `services/smoke-test`), réponse `200 {ok: true, tx_id, duration_s, trace_id}` ou
         `503 {ok: false, step, error, duration_s, trace_id}`. Un appel peut durer jusqu'à ~20 s (4 étapes × 5 s) ;
      3. `GET /api/operations/consistency` de payment-api (réseau interne) renvoie `consistent: true`.
    - **Déduplication** : une alerte déjà reçue (même `alert_id`), ou une alerte de même `incident_type` et
      même `target` qu'un incident ouvert ou résolu depuis moins de 120 s, est **rattachée** à cet incident.
      Elle ne déclenche pas de nouvelle action, ce qui évite les remédiations en boucle.
    - **Chronomètre** : `time_to_recover_seconds` = `resolved_at` − `detected_at` de la première alerte.
    - **Surveillance intégrée (watchdog)** : le moteur mesure lui-même, toutes les 5 s, l'état de chaque composant
      et de chaque **connexion** entre composants (schéma `Topology`, ADR-DEV-0006) :
      `/health` et `/ready` des services, `checks.database` et `info.auth_jwks` de leur `/ready`, les appels à
      travers le WAF, et la dernière transaction du smoke test (`GET /last`, sans en déclencher une).
      Il vérifiera aussi la cohérence des données toutes les 30 s et créera ses propres alertes
      (`source: watchdog`) : c'est un filet de sécurité si la chaîne ML / Prometheus ne détecte pas l'incident.

    ## Table des playbooks (v1)

    | incident_type | Action | Dépend de |
    |---|---|---|
    | `SERVICE_DOWN` | redémarrer le conteneur `target` ; `stop` puis `start` à la 2ᵉ tentative | docker-proxy (Infra, acté) |
    | `DEPENDENCY_DOWN` | redémarrer le conteneur de base de données `target` (`postgres`) | idem |
    | `TRAFFIC_FLOOD` | bloquer `indicators.source_ip` au WAF (15 min), puis redémarrer `target` si `/ready` reste en échec | API de blocage du WAF (Cyber) |
    | `BRUTE_FORCE` | bloquer `indicators.source_ip` au WAF (15 min) | idem |
    | `TOKEN_COMPROMISE` | redémarrer le conteneur `auth` : nouvelle clé éphémère, **tous les jetons révoqués** (ADR-DEV-0003) | docker-proxy |
    | `DATA_TAMPERING` | restaurer la base `payment` depuis la dernière sauvegarde saine | procédure de restauration (Infra) |

    **Actions sur les conteneurs** : uniquement via le `docker-proxy` de l'Infra (`http://docker-proxy:2375`), qui
    n'autorise que la lecture des conteneurs et `start` / `stop` / `restart`. Pas de `create` ni d'`exec` : le moteur
    ne peut ni recréer un conteneur ni exécuter de commande dedans (ADR-DEV-0005). Liste blanche des cibles :
    `alert.schema.json` (`target`).

    Les erreurs suivent le format `application/problem+json` (RFC 9457). Les sondes suivent
    `contracts/service-conventions.md`.

servers:
  - url: http://remediation:8000
    description: Supervision (watchdog + API du dashboard). Réseau interne ; 127.0.0.1:18090 sur le PC Hôte
  - url: http://auto-recovery:8000
    description: Action (webhook Alertmanager). Réseau interne ; 127.0.0.1:18095 sur le PC Hôte

tags:
  - name: alerts
    description: Réception des alertes (machines)
  - name: incidents
    description: Suivi des incidents (dashboard)
  - name: probes
    description: Conventions communes (contracts/service-conventions.md)

paths:
  # ---------------------------------------------------------------- alertes
  /alerts:
    post:
      x-implementation: v2
      tags: [alerts]
      summary: Signaler un incident (non servi en v1)
      description: |
        Point d'entrée commun de l'IA, du WAF et du SIEM. Le corps suit `contracts/alert.schema.json`.
        Réessayer avec le même `alert_id` est sans risque (réponse 200, aucune nouvelle action).
      security:
        - alertToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './alert.schema.json' }
      responses:
        '202':
          description: Alerte acceptée, nouvel incident ouvert. La remédiation démarre en arrière-plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertAccepted' }
        '200':
          description: Alerte rattachée à un incident existant (doublon ou cooldown) — aucune nouvelle action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /webhook/alertmanager:
    servers:
      - url: http://auto-recovery:8000
        description: Servi par auto-recovery en v1 (receiver `auto-recovery` de infra/alertmanager/alertmanager.yml)
    post:
      tags: [alerts]
      summary: Recevoir un webhook Alertmanager (format natif v4)
      description: |
        Chemin déjà configuré par l'Infra (receiver Alertmanager) : évite de transformer le format d'Alertmanager.

        **Comportement v1 (`auto-recovery`)** — sous-ensemble de la cible décrite plus bas :
        - action lue dans le label `remediation` ; seule `restart` existe (`none` ou absent ⇒ observée seulement) ;
        - `target` confronté à la liste blanche `REMEDIATION_ALLOWED_TARGETS`
          (`bunkerweb,frontend,auth,payment-api,postgres,vault`), sinon `remediation_refused` ;
        - cooldown de 45 s par cible (`REMEDIATION_COOLDOWN_SECONDS`) contre les redémarrages en boucle ;
        - restart via `docker-proxy`, puis **preuve de reprise** : `GET http://txprobe:8000/check` répété jusqu'à
          `ok: true` (90 s maximum). Pas encore de vérification `/ready` ni `consistency` séparée ;
        - réponse `202 {accepted: [{alertname, action, target}]}`, l'action s'exécute en arrière-plan ;
        - pas d'objet `Incident` : chaque étape est un événement de `GET /events` d'auto-recovery et un log JSON
          (`remediation_started`, `remediation_succeeded`, `remediation_failed`…).

        **Cible (v2)** — chaque alerte `firing` est convertie :

        | Champ de l'alerte | Source dans Alertmanager |
        |---|---|
        | `alert_id` | `fingerprint` + `startsAt` |
        | `target` | label `target` (service Compose, liste blanche de `alert.schema.json`) |
        | `incident_type` | label `incident_type` s'il est présent ; **sinon** `remediation: restart` ⇒ `SERVICE_DOWN` |
        | `severity` | label `severity` : `critical` ⇒ `critical`, toute autre valeur (`major`, `warning`) ⇒ `warning` |
        | `summary` | annotation `summary` |
        | `indicators.source_ip` | label `source_ip` (facultatif) |
        | `detected_at` | `startsAt` |

        Une alerte sans `incident_type` et avec `remediation: none` (ou sans label `remediation`) est **observée
        seulement** : publiée sur `/events` et comptée, sans action. Le label `incident_type` est recommandé sur les
        règles qui ne relèvent pas d'un simple redémarrage (ex. `DEPENDENCY_DOWN` sur `postgres`).

        Les alertes `resolved` sont ignorées : c'est le moteur qui vérifie la reprise.
        Une alerte dont les labels sont invalides est ignorée et logguée (`alert_rejected`). Le webhook reçoit
        quand même 200, pour qu'Alertmanager ne la renvoie pas en boucle.

        Configuration côté Alertmanager :
        `http_config: { authorization: { type: Bearer, credentials_file: /run/secrets/remediation_token } }`
      security:
        - alertToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertmanagerWebhook' }
      responses:
        '202':
          description: v1 (auto-recovery) — alertes acceptées, remédiation lancée en arrière-plan
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted:
                    type: array
                    items:
                      type: object
                      required: [alertname, action, target]
                      properties:
                        alertname: { type: string, example: PaymentApiUnavailable }
                        action: { type: string, enum: [restart] }
                        target: { type: string, example: payment-api }
        '200':
          description: Cible (v2) — webhook traité
          content:
            application/json:
              schema:
                type: object
                required: [accepted, ignored]
                properties:
                  accepted:
                    type: array
                    items: { $ref: '#/components/schemas/AlertAccepted' }
                  ignored: { type: integer, description: Alertes resolved ou invalides }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # -------------------------------------------------------------- incidents
  /incidents:
    get:
      x-implementation: v2
      tags: [incidents]
      summary: Lister les incidents, les plus récents d'abord (non servi en v1)
      security:
        - operatorJwt: []
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/IncidentStatus' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Incidents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Incident' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /incidents/{incidentId}:
    get:
      x-implementation: v2
      tags: [incidents]
      summary: Détail d'un incident, avec la chronologie de ses étapes (non servi en v1)
      security:
        - operatorJwt: []
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Incident
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /services:
    get:
      tags: [incidents]
      summary: État des composants et des connexions (dernier passage du watchdog)
      description: Réponse 503 tant que le premier passage du watchdog n'est pas terminé (quelques secondes).
      security:
        - operatorJwt: []
      responses:
        '200':
          description: États
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topology' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /playbooks:
    get:
      x-implementation: v2
      tags: [incidents]
      summary: Table de décision incident_type → actions, version en vigueur (non servi en v1)
      security:
        - operatorJwt: []
      responses:
        '200':
          description: Playbooks
          content:
            application/json:
              schema:
                type: object
                required: [version, playbooks]
                properties:
                  version: { type: string, example: '1' }
                  playbooks:
                    type: array
                    items: { $ref: '#/components/schemas/Playbook' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /events:
    get:
      tags: [incidents]
      summary: Flux temps réel pour le dashboard (Server-Sent Events)
      description: |
        Servi par `remediation`. En v1, seuls les événements `services` et `heartbeat` sont émis (pas encore
        d'`incident`). À ne pas confondre avec `GET /events` d'`auto-recovery`, simple journal JSON de ses actions.

        Dès la connexion, le serveur envoie l'état courant : un événement `services`, puis un événement `incident`
        par incident ouvert ou récent. Il envoie ensuite un événement à chaque changement.

        | `event` | `data` (JSON) | Quand |
        |---|---|---|
        | `incident` | `Incident` complet | création, chaque changement d'état ou nouvelle étape |
        | `services` | `Topology` | à la connexion, puis à chaque passage du watchdog (toutes les 5 s) |
        | `heartbeat` | `{"at": "<date-time>"}` | toutes les 15 s (garde la connexion ouverte à travers les proxys) |

        `EventSource` ne permet pas d'envoyer l'en-tête `Authorization`. Le dashboard lit donc le flux avec
        `fetch()` en streaming : jamais de jeton dans l'URL, car il finirait dans les logs. En cas de coupure,
        il se reconnecte et reçoit à nouveau l'état complet.
      security:
        - operatorJwt: []
      responses:
        '200':
          description: Flux d'événements
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                event: incident
                data: {"id":"7f0c…","status":"ACTING","incident_type":"SERVICE_DOWN","target":"payment-api",…}

        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------ sondes
  /health:
    get:
      tags: [probes]
      summary: Processus vivant
      security: []
      responses:
        '200': { description: OK }
  /ready:
    get:
      tags: [probes]
      summary: Prêt (état local SQLite accessible)
      security: []
      responses:
        '200': { description: Prêt }
        '503': { description: Non prêt }
  /metrics:
    get:
      tags: [probes]
      summary: Métriques Prometheus
      description: |
        En plus des métriques communes :
        `remediation_incidents_total{incident_type,outcome}` (outcome = resolved | escalated),
        `remediation_actions_total{action,result}`, `remediation_time_to_recover_seconds` (histogramme),
        `remediation_alerts_total{source,result}` (result = accepted | deduplicated | rejected),
        `remediation_component_up{kind,id}` (1 si le composant ou la connexion est opérationnel, 0 sinon).
      security: []
      responses:
        '200':
          description: Exposition texte Prometheus
          content:
            text/plain:
              schema: { type: string }

components:
  securitySchemes:
    alertToken:
      type: http
      scheme: bearer
      description: |
        Jeton de service partagé par les émetteurs d'alertes (IA, WAF, SIEM, Alertmanager).
        Côté moteur : `REMEDIATION_ALERT_TOKEN_FILE=/run/secrets/remediation_token` (secret Docker alimenté par
        Vault), 32 caractères minimum.
        Ce jeton permet seulement de **signaler** un incident : jamais de choisir l'action.
    operatorJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT RS256 émis par le service d'auth (`contracts/openapi-payment.yaml`), rôle `operator` exigé.

  responses:
    BadRequest:
      description: Corps invalide (non conforme à alert.schema.json)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Jeton absent ou invalide
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Rôle operator requis
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Incident introuvable
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    IncidentStatus:
      type: string
      enum: [DETECTED, DECIDED, ACTING, VERIFYING, RESOLVED, ESCALATED]

    AlertAccepted:
      type: object
      required: [alert_id, incident_id, deduplicated]
      properties:
        alert_id: { type: string }
        incident_id: { type: string, format: uuid }
        deduplicated: { type: boolean, description: true si rattachée à un incident existant }

    Incident:
      type: object
      required: [id, incident_type, target, severity, status, playbook, attempts, alerts, steps, detected_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        incident_type: { type: string, description: Voir alert.schema.json }
        target: { type: string }
        severity: { type: string, enum: [warning, critical] }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        summary: { type: string, description: Résumé de la première alerte }
        playbook: { type: string, example: restart_container }
        attempts: { type: integer, minimum: 0, maximum: 3 }
        alerts:
          type: array
          description: Alertes rattachées (la première a ouvert l'incident)
          items:
            type: object
            required: [alert_id, source, received_at]
            properties:
              alert_id: { type: string }
              source: { type: string }
              received_at: { type: string, format: date-time }
        steps:
          type: array
          description: Chronologie, dans l'ordre
          items: { $ref: '#/components/schemas/Step' }
        verification: { $ref: '#/components/schemas/Verification' }
        detected_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }
        time_to_recover_seconds: { type: [number, 'null'], description: resolved_at − detected_at }

    Step:
      type: object
      required: [at, status, message]
      properties:
        at: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        action: { type: string, description: 'Action exécutée (restart_container, block_ip…), si applicable' }
        ok: { type: boolean, description: Résultat de l'action ou de la vérification }
        message: { type: string, example: 'Conteneur payment-api redémarré (2,8 s)' }

    Verification:
      type: object
      description: Dernière vérification de reprise
      properties:
        ready: { type: object, additionalProperties: { type: boolean }, example: { payment-api: true, auth: true } }
        smoke_test:
          type: object
          properties:
            ok: { type: boolean }
            payment_id: { type: [string, 'null'], format: uuid }
            duration_ms: { type: integer }
            error: { type: [string, 'null'] }
        consistent: { type: boolean }
        checked_at: { type: string, format: date-time }

    ComponentState:
      type: string
      description: |
        up = opérationnel ; degraded = vivant mais pas prêt (/health OK, /ready en échec : ne pas le redémarrer,
        traiter sa dépendance) ; down = en panne ; unknown = impossible à mesurer (ex. le service qui le
        rapporte est lui-même injoignable). On n'affiche jamais « en panne » sans l'avoir mesuré.
      enum: [up, degraded, down, unknown]

    Topology:
      type: object
      required: [checked_at, nodes, links, changes]
      properties:
        checked_at: { type: string, format: date-time }
        nodes:
          type: array
          description: "Composants : bunkerweb, frontend, auth, payment-api, auth-db, payment-db, smoke-test"
          items:
            type: object
            required: [name, label, role, state, detail]
            properties:
              name:
                type: string
                example: payment-api
                description: |
                  Identifiant du composant. Égal au service Compose, sauf trois composants logiques :
                  `auth-db` et `payment-db` → service `postgres` (une instance, deux bases) ;
                  `smoke-test` → service `txprobe`. Toujours convertir avant d'en faire un `target`.
              label: { type: string, example: API paiement }
              role: { type: string, enum: [edge, app, data, probe] }
              state: { $ref: '#/components/schemas/ComponentState' }
              detail: { type: string, example: 'vivant mais pas prêt (/ready : HTTP 503)' }
        links:
          type: array
          description: Connexions, de l'appelant vers l'appelé (ex. payment-api → payment-db)
          items:
            type: object
            required: [source, target, label, state, detail]
            properties:
              source: { type: string, example: payment-api }
              target: { type: string, example: payment-db }
              label: { type: string, example: SQL }
              state: { $ref: '#/components/schemas/ComponentState' }
              detail: { type: string, example: connexion en échec }
        changes:
          type: array
          description: 50 derniers changements d'état, les plus récents d'abord
          items:
            type: object
            required: [at, kind, id, label, from, to, detail]
            properties:
              at: { type: string, format: date-time }
              kind: { type: string, enum: [node, link] }
              id: { type: string, example: payment-api->payment-db }
              label: { type: string, example: API paiement → Base paiement }
              from: { $ref: '#/components/schemas/ComponentState' }
              to: { $ref: '#/components/schemas/ComponentState' }
              detail: { type: string }

    Playbook:
      type: object
      required: [incident_type, actions, max_attempts]
      properties:
        incident_type: { type: string }
        actions:
          type: array
          items: { type: string }
          example: [restart_container, stop_start_container]
        max_attempts: { type: integer, example: 3 }
        description: { type: string }

    AlertmanagerWebhook:
      type: object
      description: Format webhook v4 d'Alertmanager (seuls les champs utilisés sont décrits)
      required: [alerts]
      properties:
        version: { type: string, example: '4' }
        status: { type: string, enum: [firing, resolved] }
        alerts:
          type: array
          items:
            type: object
            required: [status, labels, startsAt, fingerprint]
            properties:
              status: { type: string, enum: [firing, resolved] }
              labels: { type: object, additionalProperties: { type: string } }
              annotations: { type: object, additionalProperties: { type: string } }
              startsAt: { type: string, format: date-time }
              fingerprint: { type: string }

    Problem:
      type: object
      description: RFC 9457
      required: [type, title, status]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        trace_id: { type: string }
