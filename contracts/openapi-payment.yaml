openapi: 3.1.0
info:
  title: RESILIENCE-ALPHA — API métier (auth + paiements)
  version: 0.1.0
  description: |
    Contrat de l'API métier de la plateforme de paiement **fictive**.
    Producteur : Dev (`services/auth`, `services/payment-api`).
    Consommateurs : frontal web, dashboard, smoke test, Red Team, tests.

    Règles transverses :
    - **Montants en centimes** (entiers) pour éviter les erreurs d'arrondi des flottants. Devise unique : EUR.
    - **Paiement synchrone** : débit, crédit et statut sont écrits dans **une seule transaction SQL**
      (voir ADR-DEV-0002). Il n'y a jamais d'état intermédiaire visible.
    - **Idempotence** : `POST /payments` exige un en-tête `Idempotency-Key`. Rejouer la même clé renvoie
      la réponse d'origine sans nouveau débit (cas d'un client qui réessaie pendant un incident).
    - **Authentification** : JWT (RS256) émis par le service d'auth, durée de vie courte. Le payment-api
      vérifie la signature avec la clé publique exposée en JWKS : aucun secret partagé entre services.
    - **Erreurs** : format `application/problem+json` (RFC 9457).
    - `/health`, `/ready` et `/metrics` sont exposés **sur le réseau interne uniquement** (voir `contracts/network.md`).
    - Données 100 % fictives : aucun numéro de carte, IBAN réel ou donnée personnelle réelle.

servers:
  - url: /
    description: Chemins relatifs ; hôtes et ports définis dans contracts/network.md (Infra + Cyber)

tags:
  - name: auth
    description: Service d'authentification (services/auth)
  - name: accounts
    description: Comptes fictifs (services/payment-api)
  - name: payments
    description: Transactions fictives (services/payment-api)
  - name: operations
    description: Contrôles réservés aux opérateurs (services/payment-api)
  - name: probes
    description: Conventions communes à tous les services (contracts/service-conventions.md)

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- auth
  /auth/login:
    post:
      tags: [auth]
      summary: Obtenir un jeton d'accès
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authentification réussie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/me:
    get:
      tags: [auth]
      summary: Identité et rôle du porteur du jeton
      responses:
        '200':
          description: Utilisateur courant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/.well-known/jwks.json:
    get:
      tags: [auth]
      summary: Clés publiques de vérification des JWT
      security: []
      responses:
        '200':
          description: Jeu de clés JWKS (RFC 7517)
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { type: object }

  # ------------------------------------------------------------ accounts
  /accounts:
    get:
      tags: [accounts]
      summary: Lister les comptes visibles
      description: Un `client` voit ses propres comptes ; un `operator` voit tous les comptes.
      responses:
        '200':
          description: Liste des comptes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /accounts/{accountId}:
    get:
      tags: [accounts]
      summary: Détail d'un compte
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Compte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          $ref: '#/components/responses/NotFound'
          # 404 aussi quand le compte existe mais n'appartient pas au client :
          # on ne révèle pas l'existence des comptes d'autrui (anti-IDOR / énumération).

  # ------------------------------------------------------------ payments
  /payments:
    post:
      tags: [payments]
      summary: Effectuer un paiement (synchrone, idempotent)
      description: |
        Le compte débité doit appartenir à l'appelant (rôle `client`).
        Débit, crédit et enregistrement du paiement sont atomiques.
        Un paiement refusé (solde insuffisant…) est **enregistré** avec le statut `REJECTED`
        pour la traçabilité, et renvoyé en 422.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentRequest' }
      responses:
        '201':
          description: Paiement capturé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '200':
          description: Rejeu d'une `Idempotency-Key` déjà traitée — renvoie le paiement d'origine
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'
          # compte source n'appartenant pas à l'appelant
        '409':
          description: '`Idempotency-Key` déjà utilisée avec un corps de requête différent'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Paiement refusé et enregistré (`status = REJECTED`, `rejection_reason` renseigné)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [payments]
      summary: Lister les paiements visibles
      description: Un `client` voit les paiements impliquant ses comptes ; un `operator` voit tout. Ordre antéchronologique.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Liste des paiements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /payments/{paymentId}:
    get:
      tags: [payments]
      summary: Détail d'un paiement
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Paiement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------- operations
  /operations/consistency:
    get:
      tags: [operations]
      summary: Vérifier la cohérence des données (rôle operator)
      description: |
        Preuve de « données cohérentes » après remédiation, utilisée par le smoke test et le dashboard :
        - la somme des soldes est égale au total de référence (les virements internes ne créent ni ne détruisent d'argent) ;
        - chaque paiement `CAPTURED` a exactement un débit et un crédit de même montant ;
        - aucun solde négatif.
      responses:
        '200':
          description: Résultat du contrôle (y compris quand il échoue — voir `consistent`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsistencyReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # -------------------------------------------------------------- probes
  /health:
    get:
      tags: [probes]
      summary: Le processus est vivant
      security: []
      responses:
        '200':
          description: Vivant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /ready:
    get:
      tags: [probes]
      summary: Le service est prêt (dépendances joignables, ex. base de données)
      security: []
      responses:
        '200':
          description: Prêt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Pas prêt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /metrics:
    get:
      tags: [probes]
      summary: Métriques au format Prometheus
      security: []
      responses:
        '200':
          description: Exposition texte Prometheus
          content:
            text/plain:
              schema: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT RS256 émis par `/auth/login`. Claims : `sub` (user id), `role` (`client` | `operator`),
        `jti`, `iat`, `exp` (15 min). Vérifié via `/auth/.well-known/jwks.json`.

  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Identifiant unique généré par le client pour cette intention de paiement (UUID v4 recommandé).
      schema: { type: string, minLength: 8, maxLength: 64 }

  responses:
    BadRequest:
      description: Requête invalide (validation)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Jeton absent, invalide ou expiré
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Rôle ou propriété insuffisants
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ressource introuvable ou non visible par l'appelant
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Trop de tentatives (limitation de débit)
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: Dépendance indisponible (ex. base de données) — le client peut réessayer avec la même Idempotency-Key
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Durée de validité en secondes, example: 900 }

    User:
      type: object
      required: [id, username, role]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { type: string, enum: [client, operator] }

    Account:
      type: object
      required: [id, owner_id, label, balance_cents, currency]
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        label: { type: string, example: Compte courant (fictif) }
        balance_cents: { type: integer, minimum: 0, example: 150000 }
        currency: { type: string, const: EUR }

    PaymentRequest:
      type: object
      required: [from_account_id, to_account_id, amount_cents]
      additionalProperties: false
      properties:
        from_account_id: { type: string, format: uuid }
        to_account_id: { type: string, format: uuid }
        amount_cents: { type: integer, minimum: 1, maximum: 1000000, description: 'Plafond 10 000 € par paiement' }
        label: { type: string, maxLength: 140 }

    Payment:
      type: object
      required: [id, from_account_id, to_account_id, amount_cents, currency, status, created_at]
      properties:
        id: { type: string, format: uuid }
        from_account_id: { type: string, format: uuid }
        to_account_id: { type: string, format: uuid }
        amount_cents: { type: integer }
        currency: { type: string, const: EUR }
        label: { type: string }
        status: { type: string, enum: [CAPTURED, REJECTED] }
        rejection_reason:
          type: [string, 'null']
          enum: [INSUFFICIENT_FUNDS, SAME_ACCOUNT, UNKNOWN_DESTINATION, null]
        created_at: { type: string, format: date-time }

    ConsistencyReport:
      type: object
      required: [consistent, checked_at, total_balance_cents, expected_total_cents, violations]
      properties:
        consistent: { type: boolean }
        checked_at: { type: string, format: date-time }
        total_balance_cents: { type: integer }
        expected_total_cents: { type: integer }
        violations:
          type: array
          items:
            type: object
            required: [rule, detail]
            properties:
              rule: { type: string, enum: [TOTAL_MISMATCH, UNBALANCED_PAYMENT, NEGATIVE_BALANCE] }
              detail: { type: string }

    Health:
      type: object
      required: [status, service]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        service: { type: string, example: payment-api }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, down] }
          example: { database: ok }

    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference, example: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        trace_id: { type: string, description: Identifiant de corrélation, identique à celui des logs }
