# Environnement de développement du ml-detector (hors plateforme infra).
#
#   docker compose -f docker-compose.dev.yml run --rm tests   # tests unitaires
#   docker compose -f docker-compose.dev.yml run --rm train   # entraîne la baseline -> ./models
#   docker compose -f docker-compose.dev.yml run --rm demo    # trafic simulé + attaques -> clusters
#
# Le code est monté en lecture seule : une modification locale est prise en compte sans rebuild
# (rebuild seulement si requirements*.txt change). Mêmes contraintes que sur l'infra :
# non-root, système de fichiers en lecture seule, écriture dans /tmp et ./models uniquement.

x-dev: &dev
  build: { context: ., target: dev }
  image: resilience/ml-detector:dev
  user: "10001:10001"
  read_only: true
  tmpfs: ["/tmp:size=64m"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  network_mode: none          # aucun accès réseau nécessaire en mode simulé
  volumes:
    - ./detector:/app/detector:ro
    - ./scripts:/app/scripts:ro
    - ./tests:/app/tests:ro

services:
  tests:
    <<: *dev
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]

  train:
    <<: *dev
    command: ["python", "-m", "scripts.train_baseline", "--out", "/app/models/baseline.joblib"]
    volumes:
      - ./detector:/app/detector:ro
      - ./scripts:/app/scripts:ro
      - ./models:/app/models

  demo:
    <<: *dev
    command: ["python", "-m", "scripts.demo_detect", "--model", "/app/models/baseline.joblib", "--show-json"]
    volumes:
      - ./detector:/app/detector:ro
      - ./scripts:/app/scripts:ro
      - ./models:/app/models:ro
