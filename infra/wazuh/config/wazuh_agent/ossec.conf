<!--
  Agent Wazuh « hôte » du consortium : un seul agent qui surveille toute la plateforme,
  sans dé-durcir les conteneurs applicatifs.
    - FIM (syscheck) : intégrité des secrets et des configurations d'infrastructure
    - rootcheck + SCA : anomalies et bonnes pratiques de durcissement
    - analyse des journaux : BunkerWeb (XSS/DDoS/bannissements) + services métier (JSON)
      récupérés par le log-forwarder dans /var/log/agent/
  Les règles de détection correspondantes sont sur le manager (local_rules.xml).
-->
<ossec_config>
  <client>
    <server>
      <address>wazuh.manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>wazuh.manager</manager_address>
      <agent_name>consortium-host</agent_name>
    </enrollment>
    <config-profile>resilience-alpha</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
  </client>

  <!-- Intégrité des fichiers sensibles (montés en lecture seule dans l'agent) -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <directories check_all="yes" realtime="yes" report_changes="yes">/host-secrets</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/host-infra</directories>
    <directories check_all="yes" realtime="yes">/host-compose</directories>
    <skip_nfs>yes</skip_nfs>
  </syscheck>

  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
  </rootcheck>

  <!-- Évaluation de configuration de sécurité (CIS) -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
  </sca>

  <!-- Journaux du WAF BunkerWeb (texte : nginx + ModSecurity + bad-behavior) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/agent/bunkerweb.log</location>
  </localfile>

  <!-- Journaux des services métier (JSON une ligne/évènement) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/agent/auth.log</location>
  </localfile>
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/agent/payment-api.log</location>
  </localfile>
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/agent/remediation.log</location>
  </localfile>
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/agent/txprobe.log</location>
  </localfile>

  <!-- Journaux internes de l'agent -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>
</ossec_config>
