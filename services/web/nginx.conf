# Frontal statique. Contrat Infra : port 8080, GET /healthz, non-root, système de fichiers en lecture seule
# (image nginx-unprivileged : pid et fichiers temporaires dans /tmp, monté en tmpfs).
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Fichiers générés par Vite : leur nom contient une empreinte du contenu, on peut les garder en cache.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Application monopage : toute autre route renvoie index.html, jamais mis en cache (nouvelle version visible).
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}
