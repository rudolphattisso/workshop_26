# En-têtes de sécurité, inclus dans CHAQUE location : nginx n'hérite pas des add_header du bloc server
# dès qu'une location déclare les siens (ici Cache-Control).
# Aucun script ni style hors de notre origine, pas d'affichage dans une iframe (clickjacking).
add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
