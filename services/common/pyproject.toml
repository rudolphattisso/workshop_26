[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resilience-common"
version = "0.1.0"
description = "Socle commun des services Python de RESILIENCE-ALPHA (logs JSON, trace_id, probes, métriques, erreurs, vérification JWT)"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.14",
    "prometheus-client==0.21.1",
    "PyJWT[crypto]==2.10.1",
    "cryptography==44.0.0",
]

[tool.setuptools]
packages = ["resilience_common"]
