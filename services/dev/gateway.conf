# Passerelle de DÉVELOPPEMENT : imite le routage du WAF de l'Infra (BunkerWeb), URI transmise sans réécriture.
# resolver + variables : les noms sont re-résolus, un conteneur redémarré (nouvelle IP) reste joignable.
server {
  listen 8080;
  resolver 127.0.0.11 valid=5s;
  set $auth http://auth:8000;
  set $payment http://payment-api:8000;
  set $web http://web:8080;

  location /api/auth     { proxy_pass $auth; }
  location /api/payments { proxy_pass $payment; }
  location /api/accounts { proxy_pass $payment; }
  location /             { proxy_pass $web; }
}
