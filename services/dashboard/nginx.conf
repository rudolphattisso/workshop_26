# Dashboard de supervision : fichiers statiques + relais vers l'auth (connexion) et le moteur de remédiation.
# Contrat Infra : port 8080, GET /healthz, non-root, lecture seule ; publié sur 127.0.0.1 uniquement.
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  # Noms re-résolus toutes les 5 s (DNS de Docker) : un service redémarré avec une nouvelle IP reste joignable.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $auth http://auth:8000;
  set $engine http://remediation:8000;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/auth/ {
    include /etc/nginx/security-headers.conf;
    proxy_pass $auth;
  }

  # /api/remediation/events → remediation:8000/events. Flux SSE : pas de tampon, connexion longue.
  location /api/remediation/ {
    include /etc/nginx/security-headers.conf;
    rewrite ^/api/remediation/(.*)$ /$1 break;
    proxy_pass $engine;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}
