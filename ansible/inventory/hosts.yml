# Le « serveur du consortium » est le PC Hôte lui-même : Ansible pilote son Docker
# local (le runner partage le socket Docker de l'hôte). Pour piloter un autre hôte,
# ajouter une entrée avec ansible_connection: ssh.
all:
  hosts:
    pc-hote:
      ansible_connection: local
  vars:
    project_dir: "{{ lookup('env', 'PROJECT_DIR') | default(playbook_dir ~ '/../..', true) }}"
    compose_project: "{{ lookup('env', 'COMPOSE_PROJECT_NAME') | default('resilience', true) }}"
    compose: "docker compose --project-directory {{ project_dir }} -p {{ compose_project }}"
    public_url: "http://bunkerweb:8080"            # vu depuis le réseau du projet
    backup_dir: "{{ project_dir }}/backups"
    backup_keep: 10
    secret_names:
      - postgres_password
      - payment_db_password
      - auth_db_password
      - exporter_db_password
      - demo_user_password
      - probe_user_password
      - operator_password
      - remediation_token
      - grafana_admin_password
    business_services: [bunkerweb, frontend, auth, payment-api, postgres, vault]
