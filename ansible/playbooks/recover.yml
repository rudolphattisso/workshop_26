# PRA : reconstruction de la plateforme depuis les sources (images reconstruites, conteneurs
# recréés à neuf). C'est la réponse à une COMPROMISSION, là où un simple redémarrage
# (moteur de remédiation) ne traite qu'une perte de DISPONIBILITÉ.
#
#   scripts/ops.ps1 recover                         -> conteneurs recréés, données conservées
#   scripts/ops.ps1 recover -e wipe_data=true       -> base détruite puis restaurée depuis
#                                                      la dernière sauvegarde saine
#   options : -e no_cache=true (rebuild complet des images), -e pre_backup=false
- name: Reconstruire la plateforme (PRA)
  hosts: pc-hote
  gather_facts: false
  vars:
    maintenance_reason: "Reconstruction PRA (recover.yml)"
    wipe: "{{ wipe_data | default(false) | bool }}"
    # le scheduler du WAF doit être recréé AVEC son instance (sinon il perd la conf poussée)
    recover_services: "{{ business_services + ['bunkerweb-scheduler', 'bunkerweb-ui', 'bw-redis'] }}"
  tasks:
    - ansible.builtin.import_tasks: ../tasks/preflight.yml
    - ansible.builtin.import_tasks: ../tasks/attach_controller.yml
    - ansible.builtin.import_tasks: ../tasks/maintenance_on.yml

    - name: "PRA | Sauvegarde préventive avant destruction (si la base répond)"
      ansible.builtin.include_tasks: ../tasks/backup_db.yml
      when: pre_backup | default(not wipe) | bool

    - name: "PRA | Sauvegarde préventive de Vault"
      ansible.builtin.include_tasks: ../tasks/backup_vault.yml
      when: pre_backup | default(not wipe) | bool

    - name: "PRA | Horodatage du début"
      ansible.builtin.set_fact: { pra_start: "{{ now().timestamp() }}" }

    - name: "PRA | Arrêt et suppression des conteneurs métier"
      ansible.builtin.command: "{{ compose }} rm --force --stop {{ recover_services | join(' ') }} txprobe"
      changed_when: true

    - name: "PRA | Destruction du volume de données (compromission supposée)"
      ansible.builtin.command: "docker volume rm {{ compose_project }}_pgdata"
      when: wipe
      changed_when: true

    - name: "PRA | Reconstruction des images depuis les sources"
      ansible.builtin.command: "{{ compose }} build {{ '--no-cache' if (no_cache | default(false) | bool) else '' }}"
      changed_when: true

    - name: "PRA | Recréation des conteneurs"
      ansible.builtin.command: "{{ compose }} up -d --force-recreate --wait --wait-timeout 420 {{ recover_services | join(' ') }} txprobe"
      changed_when: true

    - name: "PRA | Restauration des données depuis la dernière sauvegarde saine"
      ansible.builtin.include_tasks: ../tasks/restore_db.yml
      when: wipe

    - ansible.builtin.import_tasks: ../tasks/verify.yml

    - name: "PRA | Durée de reprise (RTO mesuré)"
      ansible.builtin.debug:
        msg: "Plateforme reconstruite et vérifiée en {{ (now().timestamp() - pra_start | float) | round(1) }} s"

    - ansible.builtin.import_tasks: ../tasks/maintenance_off.yml
