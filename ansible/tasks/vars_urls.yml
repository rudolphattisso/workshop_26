- name: "URLs | Adresses des services (runner conteneurisé ou exécution native)"
  ansible.builtin.set_fact:
    in_runner: "{{ lookup('env', 'OPS_RUNNER') == '1' }}"
    waf_url: "{{ 'http://bunkerweb:8080' if lookup('env', 'OPS_RUNNER') == '1' else 'http://127.0.0.1:' ~ public_port }}"
    prom_url: "{{ 'http://prometheus:9090' if lookup('env', 'OPS_RUNNER') == '1' else 'http://127.0.0.1:9090' }}"
    am_url: "{{ 'http://alertmanager:9093' if lookup('env', 'OPS_RUNNER') == '1' else 'http://127.0.0.1:9093' }}"
    grafana_url: "{{ 'http://grafana:3000' if lookup('env', 'OPS_RUNNER') == '1' else 'http://127.0.0.1:3000' }}"
    # auto-recovery : moteur d'action (redémarre sur alerte, c'est lui qu'Alertmanager appelle).
    # remediation    : supervision du pôle Dev (watchdog + API du dashboard), n'agit pas encore.
    remediation_url: "{{ 'http://auto-recovery:8000' if lookup('env', 'OPS_RUNNER') == '1' else 'http://127.0.0.1:' ~ auto_recovery_port }}"
    watchdog_url: "{{ 'http://remediation:8000' if lookup('env', 'OPS_RUNNER') == '1' else 'http://127.0.0.1:' ~ watchdog_port }}"
  vars:
    public_port: "{{ lookup('ansible.builtin.ini', 'PUBLIC_HTTP_PORT', file=project_dir ~ '/.env', type='properties', default='80') }}"
    auto_recovery_port: "{{ lookup('ansible.builtin.ini', 'AUTO_RECOVERY_PORT', file=project_dir ~ '/.env', type='properties', default='18095') }}"
    watchdog_port: "{{ lookup('ansible.builtin.ini', 'REMEDIATION_PORT', file=project_dir ~ '/.env', type='properties', default='18090') }}"
