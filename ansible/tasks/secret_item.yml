# Un secret : voir la règle de réconciliation dans secrets.yml.
- name: "Secrets | {{ secret_name }} : fichier local ?"
  ansible.builtin.slurp:
    src: "{{ project_dir }}/secrets/{{ secret_name }}"
  register: s_file
  failed_when: false
  no_log: true

- name: "Secrets | {{ secret_name }} : valeur dans Vault ?"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ compose_project }}-vault-unsealer-1"
      - sh
      - -c
      - "VAULT_TOKEN=$(cat /vault/keys/ansible_token) vault kv get -field=value resilience/{{ secret_name }}"
  register: s_vault
  failed_when: false
  changed_when: false
  no_log: true

- name: "Secrets | {{ secret_name }} : valeur retenue"
  ansible.builtin.set_fact:
    s_has_file: "{{ s_file.content is defined }}"
    s_has_vault: "{{ s_vault.rc == 0 and (s_vault.stdout | trim | length > 0) }}"
    s_file_val: "{{ (s_file.content | b64decode | trim) if s_file.content is defined else '' }}"
    s_vault_val: "{{ s_vault.stdout | trim if s_vault.rc == 0 else '' }}"
  no_log: true

- name: "Secrets | {{ secret_name }} : décision"
  ansible.builtin.set_fact:
    s_final: >-
      {{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits'])
         if ((rotate_secrets | default(false) | bool) or (not s_has_file and not s_has_vault))
         else (s_vault_val if s_has_vault else s_file_val) }}
  no_log: true

- name: "Secrets | {{ secret_name }} : écrire dans Vault si nécessaire"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - "{{ compose_project }}-vault-unsealer-1"
      - sh
      - -c
      - "VAULT_TOKEN=$(cat /vault/keys/ansible_token) vault kv put resilience/{{ secret_name }} value=- >/dev/null"
    stdin: "{{ s_final }}"
  when: (not s_has_vault) or (s_vault_val != s_final)
  changed_when: true
  no_log: true

- name: "Secrets | {{ secret_name }} : (ré)écrire le fichier local si nécessaire"
  ansible.builtin.copy:
    dest: "{{ project_dir }}/secrets/{{ secret_name }}"
    content: "{{ s_final }}"
    mode: "0444"
    unsafe_writes: true
  when: (not s_has_file) or (s_file_val != s_final)
  no_log: true

- name: "Secrets | {{ secret_name }} : droits de lecture pour les conteneurs non-root"
  ansible.builtin.file:
    path: "{{ project_dir }}/secrets/{{ secret_name }}"
    mode: "0444"
