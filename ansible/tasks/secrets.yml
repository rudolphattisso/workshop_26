# Secrets de la plateforme : HashiCorp Vault est la SOURCE DE VÉRITÉ.
# Le dossier ./secrets/ (monté en Docker secrets) n'en est qu'une copie d'exécution, jamais versionnée.
#
# Réconciliation par secret (jamais d'écrasement silencieux d'un mot de passe déjà utilisé) :
#   fichier ET Vault absents      -> génération aléatoire, écrite dans les deux
#   fichier présent, Vault absent -> le fichier est versé dans Vault (migration, valeur conservée)
#   fichier absent, Vault présent -> le fichier est reconstruit depuis Vault (PRA : ./secrets perdu)
#   les deux présents et différents -> Vault l'emporte (le fichier est réaligné)
#   -e rotate_secrets=true        -> nouvelle valeur partout (attention : voir RUNBOOK, la base garde
#                                    les anciens mots de passe des rôles -> recover -e wipe_data=true)
- name: "Secrets | Dossier secrets/"
  ansible.builtin.file:
    path: "{{ project_dir }}/secrets"
    state: directory
    mode: "0755"

- name: "Secrets | Réconciliation fichier <-> Vault"
  ansible.builtin.include_tasks: secret_item.yml
  loop: "{{ secret_names }}"
  loop_control: { loop_var: secret_name, label: "{{ secret_name }}" }
