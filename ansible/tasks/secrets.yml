# Génère les secrets manquants (jamais d'écrasement : idempotent).
# Les fichiers restent dans ./secrets/ (ignoré par Git) et sont montés en Docker secrets.
# Rotation volontaire : -e rotate_secrets=true (attention : la base existante garde
# les anciens mots de passe des rôles -> à utiliser avec recover.yml -e wipe_data=true).
- name: "Secrets | Dossier secrets/"
  ansible.builtin.file:
    path: "{{ project_dir }}/secrets"
    state: directory
    mode: "0755"

- name: "Secrets | État des fichiers"
  ansible.builtin.stat:
    path: "{{ project_dir }}/secrets/{{ item }}"
  loop: "{{ secret_names }}"
  register: secret_files
  loop_control: { label: "{{ item }}" }

- name: "Secrets | Générer les secrets absents"
  ansible.builtin.copy:
    dest: "{{ project_dir }}/secrets/{{ item.item }}"
    content: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
    mode: "0444"
  loop: "{{ secret_files.results }}"
  loop_control: { label: "{{ item.item }}" }
  when: not item.stat.exists or (rotate_secrets | default(false) | bool)
  no_log: true

# Compose monte les secrets « fichier » tels quels (bind mount, sans remapping d'UID) :
# ils doivent être lisibles par les utilisateurs non-root des conteneurs. La protection
# côté hôte repose sur les droits du profil utilisateur (ACL Windows / home Linux).
- name: "Secrets | Droits de lecture pour les conteneurs non-root"
  ansible.builtin.file:
    path: "{{ project_dir }}/secrets/{{ item }}"
    mode: "0444"
  loop: "{{ secret_names }}"
